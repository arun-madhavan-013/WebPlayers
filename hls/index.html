<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLS Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
      color: #ccc;
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 1280px;
      margin-bottom: 16px;
    }

    .controls input {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.95rem;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #eee;
      outline: none;
    }

    .controls input:focus { border-color: #0af; }

    .controls button {
      padding: 10px 20px;
      font-size: 0.95rem;
      background: #0af;
      color: #111;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }

    .controls button:hover { background: #08d; }

    .video-shell {
      width: min(100%, 1280px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-shell video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      outline: none;
    }

    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #888;
      min-height: 1.2em;
    }

    #status.error { color: #f66; }

    #credit {
      width: 100%;
      max-width: 1280px;
      margin-top: 16px;
      font-size: 0.78rem;
      color: #555;
      text-align: center;
      line-height: 1.6;
    }

    #credit a { color: #667; text-decoration: underline; }
    #credit a:hover { color: #99a; }
  </style>
</head>
<body>
  <h1>M3U8 Player</h1>

  <div class="controls">
    <input id="urlInput" type="text" value="https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" />
    <button id="loadBtn">Load</button>
  </div>

  <div class="video-shell">
    <video id="video" controls></video>
  </div>
  <p id="status"></p>

  <p id="credit">
    Demo asset: <strong>Tears of Steel</strong> &mdash;
    &copy; <a href="https://mango.blender.org" target="_blank" rel="noopener">Blender Foundation / Mango Open Movie Project</a>,
    licensed under <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>.<br>
    Streamed via <a href="https://www.unified-streaming.com" target="_blank" rel="noopener">Unified Streaming</a> demo origin.<br>
    HLS playback powered by <a href="https://github.com/video-dev/hls.js" target="_blank" rel="noopener">hls.js</a>,
    licensed under <a href="https://github.com/video-dev/hls.js/blob/master/LICENSE" target="_blank" rel="noopener">Apache 2.0</a>,
    served via <a href="https://www.jsdelivr.com" target="_blank" rel="noopener">jsDelivr CDN</a>.
  </p>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script>
    const video   = document.getElementById('video');
    const urlInput = document.getElementById('urlInput');
    const loadBtn  = document.getElementById('loadBtn');
    const status   = document.getElementById('status');

    let hls = null;

    let maxLevelInfo = 'unknown';

    function setStatus(msg, isError) {
      status.textContent = msg;
      status.className = isError ? 'error' : '';
    }

    function fmtBitrate(bps) {
      if (!bps) return '—';
      return bps >= 1e6 ? (bps / 1e6).toFixed(2) + ' Mbps' : Math.round(bps / 1e3) + ' kbps';
    }

    function fmtLevel(level) {
      if (!level) return 'unknown quality';
      const res = (level.width && level.height) ? (level.width + '×' + level.height) : 'unknown res';
      return res + ' @ ' + fmtBitrate(level.bitrate);
    }

    function loadStream(url) {
      url = url.trim();
      if (!url) { setStatus('Please enter a URL.', true); return; }

      // Tear down previous instance
      if (hls) { hls.destroy(); hls = null; }
      video.src = '';
      document.querySelector('.video-shell').style.aspectRatio = '16 / 9';
      maxLevelInfo = 'unknown';
      setStatus('Loading…');

      if (Hls.isSupported()) {
        hls = new Hls({
          startLevel: 0,
          testBandwidth: true,
          abrEwmaDefaultEstimate: 3000000,
          abrBandWidthFactor: 0.85,
          abrBandWidthUpFactor: 0.7,
          capLevelToPlayerSize: true
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.autoLevelCapping = -1;

        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
          const top = hls.levels[hls.levels.length - 1];
          maxLevelInfo = fmtLevel(top);
          const has4k = !!(top && top.width >= 3840 && top.height >= 2160);
          const maxNote = has4k ? '4K+ available.' : 'No 4K variant in this manifest.';
          setStatus('Auto ABR enabled — starts at lowest quality and ramps up gradually. ' + hls.levels.length + ' quality level(s). Max: ' + maxLevelInfo + '. ' + maxNote);
          video.play().catch(() => {});
        });

        // Fired by ABR controller whenever the active rendition changes
        hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
          const active = hls.levels[data.level];
          const activeRes = active && active.width && active.height ? (active.width + '×' + active.height) : 'unknown res';
          const activeBitrate = fmtBitrate(active && active.bitrate ? active.bitrate : 0);
          const estBandwidth = fmtBitrate(hls.bandwidthEstimate || 0);
          setStatus('Auto ABR active: ' + activeBitrate + ' (' + activeRes + ', estimated bandwidth: ' + estBandwidth + ', Max available: ' + maxLevelInfo + ')');
        });

        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                setStatus('Network error — trying to recover…', true);
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                setStatus('Media error — trying to recover…', true);
                hls.recoverMediaError();
                break;
              default:
                setStatus('Fatal error: ' + data.details, true);
                hls.destroy();
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS (Safari / iOS)
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          setStatus('Manifest loaded — playing.');
          video.play().catch(() => {});
        }, { once: true });
      } else {
        setStatus('HLS is not supported in this browser.', true);
      }
    }

    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) {
        document.querySelector('.video-shell').style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
      }
    });

    loadBtn.addEventListener('click', () => loadStream(urlInput.value));

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadStream(urlInput.value);
    });

    // Auto-load the pre-filled URL on page start
    loadStream(urlInput.value);
  </script>
</body>
</html>
